services:
    tor-nginx-proxy:
        container_name: tor-nginx-proxy
        image: harshitbudhraja/tor-nginx-proxy:latest
        restart: unless-stopped
        environment:
            - NGINX_PORT=80
            # - NGINX_PROXY_HOST=<YOUR_APP_URL_WITHOUT_PROTOCOL>
        ports: 
            - 3000:80
        volumes:
            - ./tor:/var/lib/tor/